name: build and verify runtime

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOBS: '4'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out runtime repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            automake binaryen build-essential clang cmake curl git \
            libicu-dev libssl-dev libunwind-dev libzstd-dev ninja-build \
            pkg-config protobuf-compiler shellcheck strace xz-utils zstd
          rustup toolchain install 1.95 --profile minimal

      - name: Install pinned wasixcc
        uses: wasix-org/wasixcc@8a505d4605b15fd466a3881d286582b23e4ffecb
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sysroot-tag: v2026-07-30.1
          version: v0.4.3

      - name: Check repository contracts
        run: ./scripts/check.sh

      - name: Build and verify bundle
        run: ./scripts/build-linux-amd64.sh

      - name: Repeat verification without a network namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=PATH unshare --net -- \
            ./scripts/verify-bundle.sh out/wurster-edge-runtime-linux-amd64

      - name: Verify published archive checksum
        shell: bash
        run: |
          set -euo pipefail
          cd out
          sha256sum --check SHA256SUMS

      - name: Upload complete Linux amd64 bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wurster-edge-runtime-linux-amd64
          path: |
            out/wurster-edge-runtime-linux-amd64.tar.gz
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            out/wurster-edge-runtime-linux-amd64.tar.gz \
            out/SHA256SUMS \
            --verify-tag \
            --generate-notes
